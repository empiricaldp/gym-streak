<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Streak</title>
<meta name="description" content="Log your gym sessions, keep your streak alive and compete with your crew.">
<meta name="theme-color" content="#e4e5e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)">
<!-- These make it behave like an app when added to an iPhone home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast sign" id="toast" role="status" aria-live="polite"></div>

<div class="wrap">
  <header class="top">
    <div><div class="date" id="date"></div><h1 class="sign" id="title">Today</h1></div>
    <div class="me" id="mebadge"></div>
  </header>
  <div id="warn" class="warn" hidden></div>
  <main id="main"><div class="skel">Loading…</div></main>
</div>

<!-- how many people have joined (filled in by app.js) -->
<div class="online" id="online" role="status" hidden></div>

<div class="tabbar" id="tabbar"><nav role="tablist">
  <button class="tab" role="tab" id="t-today" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/></svg>Today</button>
  <button class="tab" role="tab" id="t-crew" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14c2.6 0 4.4 1.4 5 4"/></svg>Crew</button>
  <button class="tab" role="tab" id="t-trophies" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.6"/></svg>Trophies</button>
  <button class="tab" role="tab" id="t-you" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>You</button>
</nav></div>

<!-- Supabase's official browser library, then our settings, then the app -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=22"></script>
<script src="split.js?v=22"></script>
<script src="app.js?v=22"></script>
</body>
</html>
